name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Thứ Hai 03:00 UTC — tránh blast radius peak CI
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      # CHỐT v5 cho riêng workflow này (FINAL DECISION 2026-06-10, 2 thực nghiệm):
      # checkout v6 làm codeql-action lỗi "Requires authentication" khi gọi API
      # (cả init lẫn upload SARIF), kể cả với persist-credentials: false.
      # KHÔNG bump lên v6 (close PR Dependabot nếu có) tới khi codeql-action công bố
      # tương thích checkout v6 — khi đó thử lại 1 commit là biết.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"
