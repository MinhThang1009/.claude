name: Spell Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cspell:
    name: cspell (English + Vietnamese custom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install cspell
        run: npm install -g cspell@8

      - name: Run cspell
        run: cspell --config .github/cspell.json "**/*.md" --no-progress --no-summary --show-suggestions || echo "::warning::Spell check found issues — review and add to .github/dictionaries/dotclaude.txt if false positives"
