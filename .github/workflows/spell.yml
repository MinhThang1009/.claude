name: Spell Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cspell:
    name: cspell (English + Vietnamese custom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install cspell
        run: npm install -g cspell@8

      - name: Run cspell
        run: cspell --config .github/cspell.json "**/*.md" --no-progress --no-summary --show-suggestions || echo "::warning::Spell check found issues — review and add to .github/dictionaries/dotclaude.txt if false positives"
