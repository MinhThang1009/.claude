name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Đảm bảo workflow run cũ bị cancel khi push commit mới vào cùng PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hook-tests:
    name: Hook tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup ~/.claude/hooks
        shell: bash
        run: |
          mkdir -p "$HOME/.claude/hooks"
          cp hooks/*.py hooks/*.sh "$HOME/.claude/hooks/"
          chmod +x "$HOME/.claude/hooks"/*.sh
      - name: Run test-bash-guard.sh
        shell: bash
        run: bash hooks/test-bash-guard.sh

  json-validate:
    name: JSON syntax + schema validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate JSON syntax
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! python3 -m json.tool "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Invalid JSON syntax"
              fail=1
            else
              echo "OK $f"
            fi
          done < <(find . -type f -name '*.json' -not -path './.git/*' -not -path './node_modules/*')
          exit $fail
      - name: Install jsonschema
        run: pip install --quiet jsonschema
      - name: Validate JSON schemas (file có $schema field)
        run: python scripts/validate-json-schema.py

  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run lychee (offline mode — chỉ check relative links nội bộ)
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline mode: KHÔNG fetch external URL. Chỉ verify file local tồn tại.
          # External URL checking fragile trong CI (rate-limit, redirect, auth, transient
          # network) — không phản ánh repo health. Internal link mới là regression catch.
          # External link recheck nên là separate scheduled job nếu cần.
          args: >-
            --no-progress
            --offline
            './**/*.md'
          fail: true

  shellcheck:
    name: Shell script lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck hooks/*.sh

  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install ruff
        run: pip install --quiet ruff
      - name: Lint hooks/
        run: ruff check hooks/

  python-tests:
    name: Python tests (pytest + coverage 100% gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pytest + coverage + dependencies
        run: pip install --quiet pytest coverage pyyaml jsonschema
      - name: Run pytest under coverage
        run: python -m coverage run --source=scripts,hooks -m pytest tests/ -v
      - name: Enforce 100% coverage
        run: python -m coverage report -m --fail-under=100

  markdown-lint:
    name: Markdown style lint (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: '**/*.md'

  actionlint:
    name: GitHub Actions YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: raven-actions/actionlint@v2

  frontmatter-validate:
    name: Frontmatter schema (skills/agents/output-styles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Validate frontmatter
        run: python scripts/validate-frontmatter.py
