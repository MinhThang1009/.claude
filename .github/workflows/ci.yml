name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Đảm bảo workflow run cũ bị cancel khi push commit mới vào cùng PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hook-tests:
    name: Hook tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup ~/.claude/hooks
        shell: bash
        run: |
          mkdir -p "$HOME/.claude/hooks"
          cp hooks/*.py hooks/*.sh "$HOME/.claude/hooks/"
          chmod +x "$HOME/.claude/hooks"/*.sh
      - name: Run test-bash-guard.sh
        shell: bash
        run: bash hooks/test-bash-guard.sh

  json-validate:
    name: JSON syntax + schema validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate JSON syntax
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! python3 -m json.tool "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Invalid JSON syntax"
              fail=1
            else
              echo "OK $f"
            fi
          done < <(find . -type f -name '*.json' -not -path './.git/*' -not -path './node_modules/*')
          exit $fail
      - name: Install jsonschema
        run: pip install --quiet jsonschema
      - name: Validate JSON schemas (file có $schema field)
        run: python scripts/validate-json-schema.py

  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run lychee (offline mode — chỉ check relative links nội bộ)
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline mode: KHÔNG fetch external URL. Chỉ verify file local tồn tại.
          # External URL checking fragile trong CI (rate-limit, redirect, auth, transient
          # network) — không phản ánh repo health. Internal link mới là regression catch.
          # External link recheck nên là separate scheduled job nếu cần.
          args: >-
            --no-progress
            --offline
            './**/*.md'
          fail: true

  shellcheck:
    name: Shell script lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck hooks/*.sh

  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install ruff
        run: pip install --quiet ruff
      - name: Lint hooks/ and scripts/
        run: ruff check hooks/ scripts/
      - name: Format check hooks/ and scripts/
        run: ruff format --check hooks/ scripts/

  python-tests:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Test trên min supported (3.10) + latest stable. Hooks shebang
        # yêu cầu >=3.6 nhưng setup-python@v6 chỉ support 3.7+ → 3.10 là ngưỡng
        # practical (Python 3.10 = first version có match-case statement).
        python-version: ['3.10', '3.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: pip install --quiet -r requirements-test.txt
      - name: Run pytest under coverage (line + branch)
        run: python -m coverage run --branch --source=scripts,hooks -m pytest tests/ -v
      - name: Enforce 100% coverage
        run: python -m coverage report -m --fail-under=100
      - name: Generate coverage XML for Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.x'
        run: python -m coverage xml
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.x'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  markdown-lint:
    name: Markdown style lint (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'

  actionlint:
    name: GitHub Actions YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: raven-actions/actionlint@v2

  frontmatter-validate:
    name: Frontmatter schema (skills/agents/output-styles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Validate frontmatter
        run: python scripts/validate-frontmatter.py

  marketplace-validate:
    name: Marketplace JSON validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate marketplace.json
        run: python scripts/validate-marketplace.py

  symlinks-test:
    name: Test create-symlinks.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Run create-symlinks.sh (load all plugins)
        run: |
          # CI: clear .claude-load.txt để load tất cả plugins → verify full count
          : > .claude-load.txt
          bash scripts/create-symlinks.sh
      - name: Verify agents (27 files)
        run: |
          count=$(find ~/.claude/agents -maxdepth 1 -name "*.md" | wc -l)
          echo "agents: $count"
          [ "$count" -eq 27 ] || { echo "Expected 27, got $count"; exit 1; }
      - name: Verify skills (37 dirs)
        run: |
          count=$(find -L ~/.claude/skills -maxdepth 1 -mindepth 1 -type d | wc -l)
          echo "skills: $count"
          [ "$count" -eq 37 ] || { echo "Expected 37, got $count"; exit 1; }
      - name: Verify commands (11 files)
        run: |
          count=$(find ~/.claude/commands -maxdepth 1 -name "*.md" | wc -l)
          echo "commands: $count"
          [ "$count" -eq 11 ] || { echo "Expected 11, got $count"; exit 1; }

  symlinks-test-windows:
    name: Test create-symlinks.ps1 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run create-symlinks.ps1 (load all plugins)
        shell: pwsh
        run: |
          # CI: clear .claude-load.txt để load tất cả plugins
          Set-Content .claude-load.txt ""
          powershell -File scripts/create-symlinks.ps1
      - name: Verify agents (27 files)
        shell: pwsh
        run: |
          $count = (Get-ChildItem "$env:USERPROFILE\.claude\agents" -Filter "*.md" -ErrorAction SilentlyContinue).Count
          Write-Host "agents: $count"
          if ($count -ne 27) { Write-Error "Expected 27, got $count"; exit 1 }
      - name: Verify skills (37 dirs)
        shell: pwsh
        run: |
          $count = (Get-ChildItem "$env:USERPROFILE\.claude\skills" -ErrorAction SilentlyContinue).Count
          Write-Host "skills: $count"
          if ($count -ne 37) { Write-Error "Expected 37, got $count"; exit 1 }
      - name: Verify commands (11 files)
        shell: pwsh
        run: |
          $count = (Get-ChildItem "$env:USERPROFILE\.claude\commands" -Filter "*.md" -ErrorAction SilentlyContinue).Count
          Write-Host "commands: $count"
          if ($count -ne 11) { Write-Error "Expected 11, got $count"; exit 1 }
