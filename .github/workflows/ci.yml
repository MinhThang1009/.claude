name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN chỉ cần đọc repo — hardening theo least-privilege
permissions:
  contents: read

# Đảm bảo workflow run cũ bị cancel khi push commit mới vào cùng PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hook-tests:
    name: Hook tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup ~/.claude/hooks
        shell: bash
        run: |
          mkdir -p "$HOME/.claude/hooks"
          cp hooks/*.py hooks/*.sh "$HOME/.claude/hooks/"
          chmod +x "$HOME/.claude/hooks"/*.sh
      - name: Run test-bash-guard.sh
        shell: bash
        run: bash hooks/test-bash-guard.sh

  json-validate:
    name: JSON syntax + schema validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Validate JSON syntax
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! python3 -m json.tool "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Invalid JSON syntax"
              fail=1
            else
              echo "OK $f"
            fi
          done < <(find . -type f -name '*.json' -not -path './.git/*' -not -path './node_modules/*')
          exit $fail
      - name: Install jsonschema
        run: pip install --quiet jsonschema
      - name: Validate JSON schemas (file có $schema field)
        run: python scripts/validate-json-schema.py

  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run lychee (offline mode — chỉ check relative links nội bộ)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          # Offline mode: KHÔNG fetch external URL. Chỉ verify file local tồn tại.
          # External URL checking fragile trong CI (rate-limit, redirect, auth, transient
          # network) — không phản ánh repo health. Internal link mới là regression catch.
          # External link recheck nên là separate scheduled job nếu cần.
          args: >-
            --no-progress
            --offline
            './**/*.md'
          fail: true

  shellcheck:
    name: Shell script lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # hooks/: strict (mọi severity) — code chạy trong session thật
          shellcheck hooks/*.sh
          # Các .sh còn lại (scripts/, tests/, plugins/): mức warning trở lên
          find . -name "*.sh" -not -path "./.git/*" -not -path "./hooks/*" -print0 \
            | xargs -0 shellcheck --severity=warning

  powershell-lint:
    name: PowerShell lint (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning,Error
          if ($results) { $results | Format-Table RuleName,Severity,ScriptName,Line -AutoSize | Out-String -Width 200 | Write-Output }
          # Warning chỉ in tham khảo (Write-Host hợp lệ với CLI script) — fail khi có Error
          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) { Write-Error "PSScriptAnalyzer: $($errors.Count) error"; exit 1 }

  python-typecheck:
    name: Python type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install mypy + type stubs
        run: pip install --quiet mypy types-PyYAML types-jsonschema
      - name: Type check hooks/ and scripts/
        run: mypy hooks/ scripts/

  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install ruff
        run: pip install --quiet ruff
      - name: Lint hooks/ and scripts/
        run: ruff check hooks/ scripts/
      - name: Format check hooks/ and scripts/
        run: ruff format --check hooks/ scripts/

  python-tests:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Test trên min supported (3.10) + latest stable. Hooks shebang
        # yêu cầu >=3.6 nhưng setup-python@v5 chỉ support 3.7+ → 3.10 là ngưỡng
        # practical (Python 3.10 = first version có match-case statement).
        python-version: ['3.10', '3.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: pip install --quiet -r requirements-test.txt
      - name: Run pytest under coverage (line + branch)
        run: python -m coverage run --branch --source=scripts,hooks -m pytest tests/ -v
      - name: Enforce 100% coverage
        run: python -m coverage report -m --fail-under=100
  markdown-lint:
    name: Markdown style lint (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: '**/*.md'

  actionlint:
    name: GitHub Actions YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2

  yaml-lint:
    name: YAML lint (yamllint — ngoài workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install yamllint
        run: pip install --quiet yamllint
      # Workflows đã có actionlint — job này cover phần YAML còn lại
      # (dependabot, issue templates, pre-commit, plugin yaml...)
      - name: Lint YAML ngoài .github/workflows
        run: |
          find . \( -name "*.yml" -o -name "*.yaml" \) -not -path "./.git/*" -not -path "./.github/workflows/*" -print0 \
            | xargs -0 yamllint -d "{extends: relaxed, rules: {line-length: disable}}"

  frontmatter-validate:
    name: Frontmatter schema (skills/agents/output-styles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Validate frontmatter
        run: python scripts/validate-frontmatter.py

  marketplace-validate:
    name: Marketplace JSON validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Validate marketplace.json
        run: python scripts/validate-marketplace.py

  symlinks-test:
    name: Test create-symlinks.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Run create-symlinks.sh (load all plugins)
        run: |
          # CI: clear .claude-load.txt để load tất cả plugins → verify full count
          : > .claude-load.txt
          bash scripts/create-symlinks.sh
      # Expected count tính động từ repo (unique basename — script dedup khi trùng tên),
      # không hardcode để khỏi stale mỗi lần thêm/bớt agent/skill/command.
      - name: Verify agents (count từ repo)
        run: |
          expected=$(find plugins/*/agents -maxdepth 1 -name "*.md" -exec basename {} \; 2>/dev/null | sort -u | wc -l)
          count=$(find ~/.claude/agents -maxdepth 1 -name "*.md" | wc -l)
          echo "agents: $count (expected: $expected)"
          [ "$expected" -gt 0 ] || { echo "Repo không có agent nào — nghi glob sai"; exit 1; }
          [ "$count" -eq "$expected" ] || { echo "Expected $expected, got $count"; exit 1; }
      - name: Verify skills (count từ repo)
        run: |
          expected=$({ find plugins/*/skills -mindepth 1 -maxdepth 1 -type d 2>/dev/null; find .claude/skills -mindepth 1 -maxdepth 1 -type d 2>/dev/null; } | xargs -n1 basename | sort -u | wc -l)
          count=$(find -L ~/.claude/skills -maxdepth 1 -mindepth 1 -type d | wc -l)
          echo "skills: $count (expected: $expected)"
          [ "$expected" -gt 0 ] || { echo "Repo không có skill nào — nghi glob sai"; exit 1; }
          [ "$count" -eq "$expected" ] || { echo "Expected $expected, got $count"; exit 1; }
      # Không guard expected>0: repo hiện 0 commands là hợp lệ (commands đã chuyển
      # thành skills) — check tự kích hoạt lại khi plugin nào đó thêm commands/.
      - name: Verify commands (count từ repo)
        run: |
          expected=$(find plugins/*/commands -maxdepth 1 -name "*.md" -exec basename {} \; 2>/dev/null | sort -u | wc -l)
          count=$(find ~/.claude/commands -maxdepth 1 -name "*.md" | wc -l)
          echo "commands: $count (expected: $expected)"
          [ "$count" -eq "$expected" ] || { echo "Expected $expected, got $count"; exit 1; }

  symlinks-test-windows:
    name: Test create-symlinks.ps1 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run create-symlinks.ps1 (load all plugins)
        shell: pwsh
        run: |
          # CI: clear .claude-load.txt để load tất cả plugins
          Set-Content .claude-load.txt ""
          powershell -File scripts/create-symlinks.ps1
      # Expected count tính động từ repo (unique Name — mklink fail khi trùng tên → dedup),
      # không hardcode để khỏi stale mỗi lần thêm/bớt agent/skill/command.
      - name: Verify agents (count từ repo)
        shell: pwsh
        run: |
          $expected = (Get-ChildItem plugins\*\agents\*.md -ErrorAction SilentlyContinue | Group-Object Name).Count
          $count = (Get-ChildItem "$env:USERPROFILE\.claude\agents" -Filter "*.md" -ErrorAction SilentlyContinue).Count
          Write-Host "agents: $count (expected: $expected)"
          if ($expected -eq 0) { Write-Error "Repo không có agent nào — nghi glob sai"; exit 1 }
          if ($count -ne $expected) { Write-Error "Expected $expected, got $count"; exit 1 }
      - name: Verify skills (count từ repo)
        shell: pwsh
        run: |
          $expected = (Get-ChildItem plugins\*\skills\* -Directory -ErrorAction SilentlyContinue | Group-Object Name).Count
          $count = (Get-ChildItem "$env:USERPROFILE\.claude\skills" -ErrorAction SilentlyContinue).Count
          Write-Host "skills: $count (expected: $expected)"
          if ($expected -eq 0) { Write-Error "Repo không có skill nào — nghi glob sai"; exit 1 }
          if ($count -ne $expected) { Write-Error "Expected $expected, got $count"; exit 1 }
      # Không guard expected>0: repo hiện 0 commands là hợp lệ (commands đã chuyển
      # thành skills) — check tự kích hoạt lại khi plugin nào đó thêm commands/.
      - name: Verify commands (count từ repo)
        shell: pwsh
        run: |
          $expected = (Get-ChildItem plugins\*\commands\*.md -ErrorAction SilentlyContinue | Group-Object Name).Count
          $count = (Get-ChildItem "$env:USERPROFILE\.claude\commands" -Filter "*.md" -ErrorAction SilentlyContinue).Count
          Write-Host "commands: $count (expected: $expected)"
          if ($count -ne $expected) { Write-Error "Expected $expected, got $count"; exit 1 }
