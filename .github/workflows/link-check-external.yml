name: External Link Check

on:
  schedule:
    # Thứ Hai 05:00 UTC — sau CodeQL/secret-scan, weekly cadence.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    name: Lychee external links (online)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run lychee (online mode)
        id: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          # Check tất cả .md, online mode (không có --offline)
          # Skip private/local URLs để tránh false positive.
          # KHÔNG dùng --exclude-mail: flag bị xóa khỏi lychee (mail đã exclude
          # mặc định) — flag lạ làm lychee chết ngay → issue báo động giả mỗi tuần.
          # --accept 403/429: site chặn bot (claude.ai) / rate-limit (gnu.org) vẫn là
          # link sống với người thật — 404 vẫn bị bắt bình thường.
          # --exclude c21d3c10...: URL ví dụ minh hoạ format trong SKILL.md vendored
          # (anthropics/claude-code, claude-cli-internal) — cố ý không resolve được.
          # Bỏ qua template assets của repo-scaffold: link trong đó chỉ hợp lệ sau khi
          # scaffold vào repo đích, còn {{OWNER}}/{{REPO}} là placeholder intentional.
          args: >-
            --verbose
            --no-progress
            --max-retries 2
            --retry-wait-time 5
            --timeout 20
            --accept '200..=299, 403, 429'
            --exclude 'c21d3c10bc8e898b7ac1a2d745bdc9bc4e423afe'
            --exclude-path 'plugins/repo-scaffold/skills/repo-scaffold/assets/'
            --exclude-loopback
            --exclude-private
            "**/*.md"
          fail: false
          output: ./lychee-report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lychee-external-link-report
          path: lychee-report.md
          retention-days: 14

      # Đếm error từ report thay vì tin exit_code của lychee — exit_code từng ≠ 0
      # dù report 0 error (run 27289521172) → issue báo động giả.
      # Report thiếu/không parse được → coi như unknown → vẫn mở issue (fail-loud).
      - name: Đếm error trong report
        id: report
        if: always()
        run: |
          if [ -f lychee-report.md ]; then
            errs=$(grep -E '🚫 Errors' lychee-report.md | grep -oE '[0-9]+' | tail -1)
            echo "errors=${errs:-unknown}" >> "$GITHUB_OUTPUT"
          else
            echo "errors=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue nếu phát hiện broken link
        if: steps.report.outputs.errors != '0'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "External link check: phát hiện URL hỏng (${{ github.run_id }})"
          content-filepath: ./lychee-report.md
          labels: documentation, link-check, automated
