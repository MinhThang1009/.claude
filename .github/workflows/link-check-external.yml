name: External Link Check

on:
  schedule:
    # Thứ Hai 05:00 UTC — sau CodeQL/secret-scan, weekly cadence.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    name: Lychee external links (online)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run lychee (online mode)
        id: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          # Check tất cả .md, online mode (không có --offline)
          # Skip private/local URLs để tránh false positive
          args: >-
            --verbose
            --no-progress
            --max-retries 2
            --retry-wait-time 5
            --timeout 20
            --exclude-mail
            --exclude-loopback
            --exclude-private
            "**/*.md"
          fail: false
          output: ./lychee-report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lychee-external-link-report
          path: lychee-report.md
          retention-days: 14

      - name: Open issue nếu phát hiện broken link
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
        with:
          title: "External link check: phát hiện URL hỏng (${{ github.run_id }})"
          content-filepath: ./lychee-report.md
          labels: documentation, link-check, automated
