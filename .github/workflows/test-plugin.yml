name: Validate plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-structure:
    name: Plugin structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate marketplace manifest
        run: |
          if [ ! -f .claude-plugin/marketplace.json ]; then
            echo "✗ .claude-plugin/marketplace.json missing"
            exit 1
          fi
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          echo "✓ marketplace.json valid"

      - name: Validate plugin.json for each plugin
        run: |
          ERRORS=0
          for dir in plugins/*/; do
            plugin=$(basename "$dir")
            if [ ! -f "$dir.claude-plugin/plugin.json" ]; then
              echo "✗ $plugin: missing .claude-plugin/plugin.json"
              ERRORS=$((ERRORS + 1))
            elif python3 -c "import json; json.load(open('${dir}.claude-plugin/plugin.json'))" 2>/dev/null; then
              echo "✓ $plugin"
            else
              echo "✗ $plugin: invalid JSON"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

      - name: Validate SKILL.md frontmatter
        run: |
          ERRORS=0
          while IFS= read -r skill; do
            has_name=$(head -20 "$skill" | grep -c "^name:" || true)
            has_desc=$(head -20 "$skill" | grep -c "^description:" || true)
            if [ "$has_name" -eq 0 ] || [ "$has_desc" -eq 0 ]; then
              echo "✗ $skill: missing name or description"
              ERRORS=$((ERRORS + 1))
            else
              echo "✓ $skill"
            fi
          done < <(find plugins -name "SKILL.md")
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

      - name: Validate marketplace lists all plugins
        run: |
          python3 -c "
          import json, os
          manifest = json.load(open('.claude-plugin/marketplace.json'))
          listed = {p['name'] for p in manifest['plugins']}
          actual = {d for d in os.listdir('plugins')
                    if os.path.isfile(os.path.join('plugins', d, '.claude-plugin', 'plugin.json'))}
          missing = actual - listed
          if missing:
              print(f'✗ Not in marketplace.json: {missing}')
              exit(1)
          print(f'✓ All {len(actual)} plugins listed in marketplace.json')
          "
