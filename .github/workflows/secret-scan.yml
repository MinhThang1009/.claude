name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Thứ Hai 04:00 UTC — sau CodeQL.
    - cron: '0 4 * * 1'

jobs:
  gitleaks:
    name: gitleaks (defense-in-depth bên cạnh detect-private-key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
