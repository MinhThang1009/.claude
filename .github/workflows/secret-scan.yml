name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Thứ Hai 04:00 UTC — sau CodeQL.
    - cron: '0 4 * * 1'

# gitleaks-action cần đọc repo; pull-requests: write để comment khi chạy trên PR
permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks (defense-in-depth bên cạnh detect-private-key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
