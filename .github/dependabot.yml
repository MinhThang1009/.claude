version: 2
updates:
  # GitHub Actions: auto-update version (Node.js 20 → 24 deprecation, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      # `include: scope` auto-thêm "(deps)" -> dùng prefix "chore" tránh double "(deps)(deps)"
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
