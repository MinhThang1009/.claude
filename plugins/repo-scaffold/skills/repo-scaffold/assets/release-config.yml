# Auto-generated release notes categories. Copy to .github/release.yml.
# Used by GitHub's "Generate release notes" (and `gh release ... --generate-notes`).
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: Features
      labels: [enhancement, feature]
    - title: Bug Fixes
      labels: [bug, fix]
    - title: Other Changes
      labels: ['*']
